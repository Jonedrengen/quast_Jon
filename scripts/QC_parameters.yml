# Reusable QC parameter thresholds for assembly quality checks.

pass_criteria:
  total_length_bp:
    min: 4200000
    max: 6400000

  gc_percent:
    min: 48.5
    max: 52.5

  contigs_500bp_or_longer:
    max: 300

  n50_bp:
    min: 50000

  ns_per_100_kbp:
    expected: 0

  duplication_ratio:
    max: 1.05

  genome_fraction_percent:
    min: 95
    applies_when: "using a close reference"
